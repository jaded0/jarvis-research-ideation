[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S.: Just-in-time Agent for Research Validation & Ideation Support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
